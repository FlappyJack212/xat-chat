<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - iXat</title>
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/authentic-xat.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #00d4ff 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .store-header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .store-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .store-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .store-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            background: white;
            border-radius: 8px;
            padding: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .store-tab {
            padding: 0.75rem 1.5rem;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .store-tab.active {
            background: #3b82f6;
            color: white;
        }

        .store-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .powers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .power-card {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .power-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .power-card h3 {
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .power-card p {
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .power-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .price {
            font-size: 1.25rem;
            font-weight: 600;
            color: #059669;
        }

        .buy-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background: #2563eb;
        }

        .buy-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .package-card {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.2s;
        }

        .package-card.featured {
            border-color: #f59e0b;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
        }

        .package-card h3 {
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .package-card .price {
            font-size: 2rem;
            font-weight: 700;
            color: #059669;
            margin: 1rem 0;
        }

        .package-card .xats {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .user-balance {
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .user-balance h3 {
            margin-bottom: 0.5rem;
            color: #1f2937;
        }

        .balance-amount {
            font-size: 1.5rem;
            font-weight: 600;
            color: #059669;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="navigation-container"></div>

    <div class="container">
        <div class="store-header">
            <h1>🛒 iXat Store</h1>
            <p>Discover powers, packages, and exclusive items</p>
        </div>

        <div class="user-balance" id="userBalance" style="display: none;">
            <h3>Your Balance</h3>
            <div class="balance-amount" id="balanceAmount">0 xats</div>
        </div>

        <div class="store-tabs">
            <button class="store-tab active" data-tab="powers">Powers</button>
            <button class="store-tab" data-tab="packages">Packages</button>
            <button class="store-tab" data-tab="auctions">Auctions</button>
        </div>

        <div class="store-content">
            <!-- Powers Tab -->
            <div id="powersTab" class="tab-content">
                <h2>Available Powers</h2>
                <div class="powers-grid" id="powersGrid">
                    <div class="loading">Loading powers...</div>
                </div>
            </div>

            <!-- Packages Tab -->
            <div id="packagesTab" class="tab-content" style="display: none;">
                <h2>Xat Packages</h2>
                <div class="packages-grid" id="packagesGrid">
                    <div class="loading">Loading packages...</div>
                </div>
            </div>

            <!-- Auctions Tab -->
            <div id="auctionsTab" class="tab-content" style="display: none;">
                <h2>Live Auctions</h2>
                <div style="text-align: center; padding: 2rem; color: #6b7280;">
                    Auctions coming soon! Check back later for exclusive items.
                </div>
            </div>
        </div>
    </div>

    <script src="../modules/auth-system.js"></script>
    <script>
        // Initialize auth system
        const authSystem = new AuthSystem();

        // Store functionality
        class Store {
            constructor() {
                this.currentTab = 'powers';
                this.powers = [];
                this.packages = [];
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadUserBalance();
                this.loadPowers();
                this.loadPackages();
            }

            setupEventListeners() {
                // Tab switching
                document.querySelectorAll('.store-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        this.switchTab(e.target.dataset.tab);
                    });
                });
            }

            switchTab(tabName) {
                // Update tab buttons
                document.querySelectorAll('.store-tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

                // Update tab content
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.style.display = 'none';
                });
                document.getElementById(`${tabName}Tab`).style.display = 'block';

                this.currentTab = tabName;
            }

            async loadUserBalance() {
                if (!authSystem.isUserAuthenticated()) {
                    document.getElementById('userBalance').style.display = 'none';
                    return;
                }

                try {
                    const user = authSystem.getCurrentUser();
                    if (user) {
                        document.getElementById('balanceAmount').textContent = `${user.xats || 0} xats`;
                        document.getElementById('userBalance').style.display = 'block';
                    }
                } catch (error) {
                    console.error('Error loading user balance:', error);
                }
            }

            async loadPowers() {
                try {
                    const response = await fetch('/api/powers');
                    const data = await response.json();

                    if (data.success) {
                        this.powers = data.powers;
                        this.renderPowers();
                    }
                } catch (error) {
                    console.error('Error loading powers:', error);
                    document.getElementById('powersGrid').innerHTML = '<div class="loading">Error loading powers</div>';
                }
            }

            renderPowers() {
                const grid = document.getElementById('powersGrid');
                
                if (this.powers.length === 0) {
                    grid.innerHTML = '<div class="loading">No powers available</div>';
                    return;
                }

                grid.innerHTML = this.powers.map(power => `
                    <div class="power-card" data-power-id="${power._id}">
                        <h3>
                            <span class="power-icon">${this.getPowerIcon(power.category)}</span>
                            ${power.displayName || power.name}
                        </h3>
                        <p>${power.description || 'No description available'}</p>
                        <div class="power-price">
                            <span class="price">${power.cost || 0} xats</span>
                            <button class="buy-btn" onclick="store.buyPower('${power._id}')">
                                Buy
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            async loadPackages() {
                try {
                    const response = await fetch('/api/store/packages');
                    const data = await response.json();

                    if (data.success) {
                        this.packages = data.packages;
                        this.renderPackages();
                    }
                } catch (error) {
                    console.error('Error loading packages:', error);
                    document.getElementById('packagesGrid').innerHTML = '<div class="loading">Error loading packages</div>';
                }
            }

            renderPackages() {
                const grid = document.getElementById('packagesGrid');
                
                if (this.packages.length === 0) {
                    grid.innerHTML = '<div class="loading">No packages available</div>';
                    return;
                }

                grid.innerHTML = this.packages.map(pkg => `
                    <div class="package-card ${pkg.id === 'premium' ? 'featured' : ''}">
                        <h3>${pkg.name}</h3>
                        <div class="price">$${pkg.price}</div>
                        <div class="xats">${pkg.xats} xats</div>
                        <p>${pkg.description}</p>
                        <button class="buy-btn" onclick="store.buyPackage('${pkg.id}')">
                            Purchase
                        </button>
                    </div>
                `).join('');
            }

            async buyPower(powerId) {
                if (!authSystem.isUserAuthenticated()) {
                    alert('Please login to purchase powers');
                    return;
                }

                try {
                    const response = await fetch('/api/powers/buy', {
                        method: 'POST',
                        headers: authSystem.getAuthHeaders(),
                        body: JSON.stringify({ powerId })
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert('Power purchased successfully!');
                        this.loadUserBalance();
                    } else {
                        alert(result.error || 'Failed to purchase power');
                    }
                } catch (error) {
                    console.error('Error purchasing power:', error);
                    alert('Failed to purchase power');
                }
            }

            async buyPackage(packageId) {
                if (!authSystem.isUserAuthenticated()) {
                    alert('Please login to purchase packages');
                    return;
                }

                alert('Package purchasing will be implemented with payment integration');
            }

            getPowerIcon(category) {
                const icons = {
                    'epic': '👑',
                    'special': '✨',
                    'moderation': '🛡️',
                    'pawn': '🎭',
                    'premium': '💎'
                };
                return icons[category] || '⚡';
            }
        }

        // Initialize store
        const store = new Store();

        // Load navigation
        fetch('/components/navigation.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navigation-container').innerHTML = html;
            })
            .catch(error => console.error('Error loading navigation:', error));
    </script>
</body>
</html>
