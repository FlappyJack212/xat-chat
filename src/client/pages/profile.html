<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - iXat</title>
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/authentic-xat.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #00d4ff 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .profile-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .profile-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .profile-sidebar {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .profile-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .profile-avatar {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar-display {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 1rem;
            border: 4px solid #e5e7eb;
        }

        .avatar-display img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-info h2 {
            color: #1f2937;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .profile-info .username {
            color: #6b7280;
            text-align: center;
            margin-bottom: 1rem;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .profile-tabs {
            display: flex;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 2rem;
        }

        .profile-tab {
            padding: 1rem 1.5rem;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .profile-tab.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .avatar-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .avatar-option:hover,
        .avatar-option.selected {
            border-color: #3b82f6;
        }

        .avatar-option img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .login-prompt {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .login-prompt h3 {
            margin-bottom: 1rem;
            color: #374151;
        }

        .login-prompt a {
            color: #3b82f6;
            text-decoration: none;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        .success-message {
            background: #f0fdf4;
            color: #16a34a;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            border: 1px solid #bbf7d0;
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            border: 1px solid #fecaca;
        }

        @media (max-width: 768px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
            
            .profile-sidebar {
                order: 2;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="navigation-container"></div>

    <div class="container">
        <div class="profile-header">
            <h1>👤 Profile</h1>
            <p>Manage your account and preferences</p>
        </div>

        <div id="profileContent">
            <!-- Login prompt for non-authenticated users -->
            <div class="login-prompt" id="loginPrompt">
                <h3>Please Login</h3>
                <p>You need to be logged in to view your profile.</p>
                <a href="login.html">Login here</a>
            </div>

            <!-- Profile content for authenticated users -->
            <div class="profile-layout" id="profileLayout" style="display: none;">
                <div class="profile-sidebar">
                    <div class="profile-avatar">
                        <div class="avatar-display" id="avatarDisplay">
                            👤
                        </div>
                    </div>
                    
                    <div class="profile-info">
                        <h2 id="profileName">Loading...</h2>
                        <div class="username" id="profileUsername">@username</div>
                    </div>

                    <div class="profile-stats">
                        <div class="stat-item">
                            <div class="stat-value" id="statXats">0</div>
                            <div class="stat-label">Xats</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statDays">0</div>
                            <div class="stat-label">Days</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statPowers">0</div>
                            <div class="stat-label">Powers</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statMessages">0</div>
                            <div class="stat-label">Messages</div>
                        </div>
                    </div>
                </div>

                <div class="profile-content">
                    <div class="profile-tabs">
                        <button class="profile-tab active" data-tab="info">Profile Info</button>
                        <button class="profile-tab" data-tab="settings">Settings</button>
                        <button class="profile-tab" data-tab="security">Security</button>
                        <button class="profile-tab" data-tab="powers">My Powers</button>
                    </div>

                    <div id="messageContainer"></div>

                    <!-- Profile Info Tab -->
                    <div id="infoTab" class="tab-content active">
                        <h3>Profile Information</h3>
                        <form id="profileForm">
                            <div class="form-group">
                                <label for="nickname">Display Name</label>
                                <input type="text" id="nickname" name="nickname" placeholder="Your display name">
                            </div>

                            <div class="form-group">
                                <label for="desc">Description</label>
                                <textarea id="desc" name="desc" placeholder="Tell us about yourself"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="website">Website</label>
                                <input type="url" id="website" name="website" placeholder="https://yourwebsite.com">
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="country">Country</label>
                                    <input type="text" id="country" name="country" placeholder="Your country">
                                </div>
                                <div class="form-group">
                                    <label for="age">Age</label>
                                    <input type="number" id="age" name="age" placeholder="Your age" min="13" max="120">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="gender">Gender</label>
                                <select id="gender" name="gender">
                                    <option value="">Prefer not to say</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </form>
                    </div>

                    <!-- Settings Tab -->
                    <div id="settingsTab" class="tab-content">
                        <h3>Account Settings</h3>
                        <form id="settingsForm">
                            <div class="form-group">
                                <label for="avatar">Avatar</label>
                                <div class="avatar-grid" id="avatarGrid">
                                    <!-- Avatar options will be loaded here -->
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Preferences</label>
                                <div style="display: grid; gap: 1rem;">
                                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                                        <input type="checkbox" id="soundEnabled" name="soundEnabled">
                                        Enable sounds
                                    </label>
                                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                                        <input type="checkbox" id="musicEnabled" name="musicEnabled">
                                        Enable music
                                    </label>
                                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                                        <input type="checkbox" id="notificationsEnabled" name="notificationsEnabled">
                                        Enable notifications
                                    </label>
                                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                                        <input type="checkbox" id="autoScrollEnabled" name="autoScrollEnabled">
                                        Auto-scroll chat
                                    </label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="language">Language</label>
                                <select id="language" name="language">
                                    <option value="en">English</option>
                                    <option value="es">Spanish</option>
                                    <option value="fr">French</option>
                                    <option value="de">German</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary">Save Settings</button>
                        </form>
                    </div>

                    <!-- Security Tab -->
                    <div id="securityTab" class="tab-content">
                        <h3>Security Settings</h3>
                        <form id="passwordForm">
                            <div class="form-group">
                                <label for="currentPassword">Current Password</label>
                                <input type="password" id="currentPassword" name="currentPassword" required>
                            </div>

                            <div class="form-group">
                                <label for="newPassword">New Password</label>
                                <input type="password" id="newPassword" name="newPassword" required minlength="6">
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword">Confirm New Password</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" required>
                            </div>

                            <button type="submit" class="btn btn-primary">Change Password</button>
                        </form>
                    </div>

                    <!-- Powers Tab -->
                    <div id="powersTab" class="tab-content">
                        <h3>My Powers</h3>
                        <div id="userPowersList">
                            <div class="loading">Loading your powers...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../modules/auth-system.js"></script>
    <script>
        // Initialize auth system
        const authSystem = new AuthSystem();

        // Profile functionality
        class Profile {
            constructor() {
                this.currentTab = 'info';
                this.user = null;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.checkAuth();
            }

            setupEventListeners() {
                // Tab switching
                document.querySelectorAll('.profile-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        this.switchTab(e.target.dataset.tab);
                    });
                });

                // Form submissions
                document.getElementById('profileForm').addEventListener('submit', (e) => {
                    this.handleProfileUpdate(e);
                });

                document.getElementById('settingsForm').addEventListener('submit', (e) => {
                    this.handleSettingsUpdate(e);
                });

                document.getElementById('passwordForm').addEventListener('submit', (e) => {
                    this.handlePasswordChange(e);
                });
            }

            checkAuth() {
                if (authSystem.isUserAuthenticated()) {
                    this.user = authSystem.getCurrentUser();
                    this.loadProfile();
                    document.getElementById('loginPrompt').style.display = 'none';
                    document.getElementById('profileLayout').style.display = 'grid';
                } else {
                    document.getElementById('loginPrompt').style.display = 'block';
                    document.getElementById('profileLayout').style.display = 'none';
                }
            }

            loadProfile() {
                if (!this.user) return;

                // Update profile display
                document.getElementById('profileName').textContent = this.user.nickname || this.user.username;
                document.getElementById('profileUsername').textContent = `@${this.user.username}`;
                document.getElementById('statXats').textContent = this.user.xats || 0;
                document.getElementById('statDays').textContent = this.user.days || 0;
                document.getElementById('statPowers').textContent = this.user.powers || 0;
                document.getElementById('statMessages').textContent = this.user.totalMessages || 0;

                // Update avatar
                this.updateAvatarDisplay(this.user.avatar);

                // Load avatar options
                this.loadAvatarOptions();

                // Populate forms
                this.populateForms();
            }

            updateAvatarDisplay(avatar) {
                const avatarDisplay = document.getElementById('avatarDisplay');
                if (avatar && avatar !== '0' && avatar !== '1') {
                    avatarDisplay.innerHTML = `<img src="../assets/images/${avatar}.png" alt="Avatar" onerror="this.parentElement.innerHTML='👤'">`;
                } else {
                    avatarDisplay.innerHTML = '👤';
                }
            }

            loadAvatarOptions() {
                const avatarGrid = document.getElementById('avatarGrid');
                const avatars = [];
                
                // Generate avatar options (1-20 for demo)
                for (let i = 1; i <= 20; i++) {
                    avatars.push(i);
                }

                avatarGrid.innerHTML = avatars.map(avatar => `
                    <div class="avatar-option" data-avatar="${avatar}" onclick="profile.selectAvatar('${avatar}')">
                        <img src="../assets/images/${avatar}.png" alt="Avatar ${avatar}" onerror="this.parentElement.innerHTML='${avatar}'">
                    </div>
                `).join('');
            }

            selectAvatar(avatar) {
                document.querySelectorAll('.avatar-option').forEach(option => {
                    option.classList.remove('selected');
                });
                document.querySelector(`[data-avatar="${avatar}"]`).classList.add('selected');
                
                // Update the main avatar display
                this.updateAvatarDisplay(avatar);
            }

            populateForms() {
                // Profile form
                document.getElementById('nickname').value = this.user.nickname || '';
                document.getElementById('desc').value = this.user.desc || '';
                document.getElementById('website').value = this.user.website || '';
                document.getElementById('country').value = this.user.country || '';
                document.getElementById('age').value = this.user.age || '';
                document.getElementById('gender').value = this.user.gender || '';

                // Settings form
                document.getElementById('soundEnabled').checked = this.user.preferences?.sound !== false;
                document.getElementById('musicEnabled').checked = this.user.preferences?.music || false;
                document.getElementById('notificationsEnabled').checked = this.user.preferences?.notifications !== false;
                document.getElementById('autoScrollEnabled').checked = this.user.preferences?.autoScroll !== false;
                document.getElementById('language').value = this.user.preferences?.language || 'en';
            }

            switchTab(tabName) {
                // Update tab buttons
                document.querySelectorAll('.profile-tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

                // Update tab content
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(`${tabName}Tab`).classList.add('active');

                this.currentTab = tabName;

                // Load tab-specific data
                if (tabName === 'powers') {
                    this.loadUserPowers();
                }
            }

            async handleProfileUpdate(event) {
                event.preventDefault();
                
                const formData = new FormData(event.target);
                const profileData = {
                    nickname: formData.get('nickname'),
                    desc: formData.get('desc'),
                    website: formData.get('website'),
                    country: formData.get('country'),
                    age: parseInt(formData.get('age')) || 0,
                    gender: formData.get('gender')
                };

                try {
                    const response = await fetch('/api/users/profile', {
                        method: 'PUT',
                        headers: authSystem.getAuthHeaders(),
                        body: JSON.stringify(profileData)
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.showMessage('Profile updated successfully!', 'success');
                        this.user = { ...this.user, ...result.user };
                        this.loadProfile();
                    } else {
                        this.showMessage(result.message || 'Failed to update profile', 'error');
                    }
                } catch (error) {
                    console.error('Profile update error:', error);
                    this.showMessage('Failed to update profile', 'error');
                }
            }

            async handleSettingsUpdate(event) {
                event.preventDefault();
                
                const formData = new FormData(event.target);
                const settingsData = {
                    preferences: {
                        sound: formData.get('soundEnabled') === 'on',
                        music: formData.get('musicEnabled') === 'on',
                        notifications: formData.get('notificationsEnabled') === 'on',
                        autoScroll: formData.get('autoScrollEnabled') === 'on',
                        language: formData.get('language')
                    }
                };

                try {
                    const response = await fetch('/api/users/profile', {
                        method: 'PUT',
                        headers: authSystem.getAuthHeaders(),
                        body: JSON.stringify(settingsData)
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.showMessage('Settings updated successfully!', 'success');
                        this.user = { ...this.user, ...result.user };
                    } else {
                        this.showMessage(result.message || 'Failed to update settings', 'error');
                    }
                } catch (error) {
                    console.error('Settings update error:', error);
                    this.showMessage('Failed to update settings', 'error');
                }
            }

            async handlePasswordChange(event) {
                event.preventDefault();
                
                const formData = new FormData(event.target);
                const passwordData = {
                    currentPassword: formData.get('currentPassword'),
                    newPassword: formData.get('newPassword')
                };

                const confirmPassword = formData.get('confirmPassword');

                if (passwordData.newPassword !== confirmPassword) {
                    this.showMessage('New passwords do not match', 'error');
                    return;
                }

                try {
                    const response = await fetch('/api/auth/change-password', {
                        method: 'PUT',
                        headers: authSystem.getAuthHeaders(),
                        body: JSON.stringify(passwordData)
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.showMessage('Password changed successfully!', 'success');
                        event.target.reset();
                    } else {
                        this.showMessage(result.message || 'Failed to change password', 'error');
                    }
                } catch (error) {
                    console.error('Password change error:', error);
                    this.showMessage('Failed to change password', 'error');
                }
            }

            async loadUserPowers() {
                try {
                    const response = await fetch('/api/powers/owned', {
                        headers: authSystem.getAuthHeaders()
                    });
                    const data = await response.json();

                    if (data.success) {
                        this.renderUserPowers(data.powers);
                    }
                } catch (error) {
                    console.error('Error loading user powers:', error);
                    document.getElementById('userPowersList').innerHTML = '<div class="loading">Error loading powers</div>';
                }
            }

            renderUserPowers(powers) {
                const container = document.getElementById('userPowersList');
                
                if (powers.length === 0) {
                    container.innerHTML = '<div class="empty-state"><h3>No powers owned</h3><p>Visit the store to purchase your first power!</p></div>';
                    return;
                }

                container.innerHTML = powers.map(power => `
                    <div style="border: 1px solid #e5e7eb; border-radius: 6px; padding: 1rem; margin-bottom: 1rem;">
                        <h4>${power.name}</h4>
                        <p>${power.description || 'No description available'}</p>
                        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                            <button class="btn btn-primary" onclick="profile.activatePower('${power.powerId}')">Activate</button>
                            <button class="btn btn-secondary" onclick="profile.deactivatePower('${power.powerId}')">Deactivate</button>
                        </div>
                    </div>
                `).join('');
            }

            showMessage(message, type) {
                const container = document.getElementById('messageContainer');
                const messageClass = type === 'success' ? 'success-message' : 'error-message';
                container.innerHTML = `<div class="${messageClass}">${message}</div>`;
                
                setTimeout(() => {
                    container.innerHTML = '';
                }, 5000);
            }
        }

        // Initialize profile
        const profile = new Profile();

        // Load navigation
        fetch('/components/navigation.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navigation-container').innerHTML = html;
            })
            .catch(error => console.error('Error loading navigation:', error));
    </script>
</body>
</html>
