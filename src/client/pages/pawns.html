<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/consolidated.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawn Powers - xat.com</title>
    <!-- Styles moved to consolidated.css -->
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ðŸŽ¨ Pawn Powers</h1>
            <p>Customize your appearance with colorful pawns</p>
        </div>

        <div class="user-info" id="userInfo">
            <div class="loading">Loading user information...</div>
        </div>

        <div id="pawnGrid" class="pawn-grid">
            <div class="loading">Loading pawn powers...</div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let pawnPowers = [];
        let userPawns = [];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadPawnPowers();
        });

        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user/profile');
                if (response.ok) {
                    currentUser = await response.json();
                    displayUserInfo();
                } else {
                    throw new Error('Failed to load user info');
                }
            } catch (error) {
                console.error('Error loading user info:', error);
                document.getElementById('userInfo').innerHTML = '<div class="error">Failed to load user information</div>';
            }
        }

        function displayUserInfo() {
            const userInfo = document.getElementById('userInfo');
            const currentPawnColor = getPawnColor(currentUser.pawn, currentUser.pawnColor);
            
            userInfo.innerHTML = `
                <h3>Your Profile</h3>
                <div class="current-pawn">
                    <div class="current-pawn-preview" style="background-color: ${currentPawnColor};">
                        ${currentUser.pawn ? 'â—' : (currentUser.nickname || currentUser.username || 'U').charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <div style="font-weight: bold;">${currentUser.nickname || currentUser.username}</div>
                        <div style="color: #cccccc; font-size: 0.9em;">Current Pawn: ${currentUser.pawn || 'Default'}</div>
                    </div>
                </div>
                <div class="user-stats">
                    <div class="stat">
                        <div class="stat-value">${currentUser.xats || 0}</div>
                        <div class="stat-label">Xats</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${currentUser.days || 0}</div>
                        <div class="stat-label">Days</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${userPawns.length}</div>
                        <div class="stat-label">Owned Pawns</div>
                    </div>
                </div>
            `;
        }

        async function loadPawnPowers() {
            try {
                const response = await fetch('/api/powers/pawns');
                if (response.ok) {
                    pawnPowers = await response.json();
                    displayPawnPowers();
                } else {
                    throw new Error('Failed to load pawn powers');
                }
            } catch (error) {
                console.error('Error loading pawn powers:', error);
                document.getElementById('pawnGrid').innerHTML = '<div class="error">Failed to load pawn powers</div>';
            }
        }

        function displayPawnPowers() {
            const pawnGrid = document.getElementById('pawnGrid');
            
            if (pawnPowers.length === 0) {
                pawnGrid.innerHTML = '<div class="error">No pawn powers available</div>';
                return;
            }

            pawnGrid.innerHTML = pawnPowers.map(power => {
                const isOwned = userPawns.includes(power.name);
                const canAfford = (currentUser?.xats || 0) >= power.cost;
                const isCurrent = currentUser?.pawn === power.name;
                
                return `
                    <div class="pawn-card ${power.rarity} ${isOwned ? 'owned' : ''}">
                        <div class="rarity-badge rarity-${power.rarity}">${power.rarity}</div>
                        <div class="pawn-preview" style="background-color: ${power.color};">
                            â—
                        </div>
                        <div class="pawn-name">${power.displayName}</div>
                        <div class="pawn-description">${power.description}</div>
                        <div class="pawn-cost ${power.cost === 0 ? 'free' : power.cost > 10000 ? 'expensive' : 'xats'}">
                            ${power.cost === 0 ? 'Free' : `${power.cost.toLocaleString()} xats`}
                        </div>
                        <div class="pawn-actions">
                            ${isCurrent ? 
                                '<button class="btn btn-success" disabled>Current</button>' :
                                isOwned ? 
                                    `<button class="btn btn-primary" onclick="equipPawn('${power.name}')">Equip</button>` :
                                    canAfford ?
                                        `<button class="btn btn-primary" onclick="buyPawn('${power.id}')">Buy</button>` :
                                        '<button class="btn btn-secondary" disabled>Not enough xats</button>'
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getPawnColor(pawn, pawnColor) {
            if (!pawn || pawn === 'off') return '#00bfff';
            
            const pawnColors = {
                'pink': '#ff69b4',
                'purple': '#8a2be2', 
                'gold': '#ffd700',
                'blueman': '#0000cd',
                'green': '#00ff00',
                'orange': '#ffa500',
                'red': '#ff0000',
                'white': '#ffffff',
                'yellow': '#ffff00',
                'cyan': '#00ffff',
                'magenta': '#ff00ff'
            };
            
            return pawnColors[pawn] || pawnColor || '#00bfff';
        }

        async function buyPawn(powerId) {
            try {
                const response = await fetch('/api/powers/buy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ powerId: powerId })
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        // Update user info
                        currentUser.xats = result.user.xats;
                        userPawns.push(result.power.name);
                        displayUserInfo();
                        displayPawnPowers();
                        alert(`Successfully purchased ${result.power.displayName}!`);
                    } else {
                        alert(result.message || 'Failed to purchase pawn');
                    }
                } else {
                    const error = await response.json();
                    alert(error.message || 'Failed to purchase pawn');
                }
            } catch (error) {
                console.error('Error buying pawn:', error);
                alert('Failed to purchase pawn');
            }
        }

        async function equipPawn(pawnName) {
            try {
                const response = await fetch('/api/user/pawn', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ pawn: pawnName })
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        currentUser.pawn = pawnName;
                        displayUserInfo();
                        displayPawnPowers();
                        alert(`Equipped ${pawnName} pawn!`);
                    } else {
                        alert(result.message || 'Failed to equip pawn');
                    }
                } else {
                    const error = await response.json();
                    alert(error.message || 'Failed to equip pawn');
                }
            } catch (error) {
                console.error('Error equipping pawn:', error);
                alert('Failed to equip pawn');
            }
        }
    </script>
</body>
</html>
