<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/consolidated.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ðŸŽ­ ShadowNet - Reset Password</title>
    <!-- Styles moved to consolidated.css -->
</head>
<body>
    <!-- Animated background elements -->
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <div class="reset-container">
        <div class="reset-header">
            <span class="icon">ðŸ”</span>
            <h1>Reset Your Password</h1>
            <p>Enter your new password below to regain access to your ShadowNet account</p>
        </div>
        
        <div id="message" class="message"></div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Enter your new password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your new password" required minlength="6">
            </div>
            
            <button type="submit" class="reset-btn">
                ðŸ”“ Reset Password & Unlock Account
            </button>
        </form>
        
        <div id="loading" class="loading">Resetting your password...</div>
        
        <div class="back-link">
            <a href="/auth.html">â† Back to Login</a>
        </div>
    </div>

    <script>
        // Get reset token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');
        
        if (!resetToken) {
            showMessage('error', 'Invalid reset link. Please request a new password reset.');
            document.getElementById('resetForm').style.display = 'none';
        }
        
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (newPassword.length < 6) {
                showMessage('error', 'Password must be at least 6 characters long');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('error', 'Passwords do not match');
                return;
            }
            
            // Show loading
            showLoading(true);
            hideMessage();
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: resetToken,
                        newPassword: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('success', 'ðŸŽ‰ Password reset successful! Redirecting to login...');
                    document.getElementById('resetForm').style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = '/auth.html';
                    }, 2000);
                } else {
                    showMessage('error', data.message || 'Password reset failed');
                }
            } catch (error) {
                console.error('Reset error:', error);
                showMessage('error', 'Network error. Please try again.');
            } finally {
                showLoading(false);
            }
        });
        
        function showMessage(type, text) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }
        
        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
