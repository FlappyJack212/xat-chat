                <!-- Chat Input -->
                <div style="height:40px; background:#16213e; border-top:1px solid #533483; padding:8px;">

    <!-- AUTHENTIC xat.com FOOTER -->

    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Integrated Modules -->
    <script src="js/xconst.js"></script>
    <script src="js/DOMUtils.js"></script>
    <script src="js/LanguageManager.js"></script>
    <script src="js/SettingsManager.js"></script>
    <script src="js/PowerManager.js"></script>
    <script src="js/UIComponents.js"></script>
    <script src="js/MediaPlayer.js"></script>
    <script src="js/KissEffectsSystem.js"></script>
    <script src="js/BlastEffectsSystem.js"></script>
    <script src="js/VisitorsManager.js"></script>
    <script src="js/TranslatorManager.js"></script>
    <script src="js/StoreManager.js"></script>
    <script src="js/SmiliesManager.js"></script>
    <script src="js/SettingsPageManager.js"></script>
    <script src="js/SortableManager.js"></script>
    <script src="js/SelectorManager.js"></script>
    <script src="js/main.js"></script>
    <script>
        let socket;
        let currentUser = null;

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('ðŸš€ [AUTHENTIC XAT] Loading authentic xat.com interface...');

            // Connect to server
            socket = io();

            socket.on('connect', () => {
                console.log('ðŸ”Œ [AUTHENTIC XAT] Connected to server');

                // Auto-join as guest (authentic xat behavior)
                authenticateAsGuest();
            });

            socket.on('authenticated', (data) => {
                console.log('ðŸ” [AUTHENTIC XAT] Authenticated:', data);
                if (data.user) {
                    currentUser = data.user;
                    updateUI();
                }
                // Auto-join main chat (authentic xat behavior)
                joinMainChat();
            });

            socket.on('roomJoined', (data) => {
                console.log('ðŸšª [AUTHENTIC XAT] Joined room:', data.room.name);
                document.querySelector('#chatContainer .chat-header').textContent = `xat.com - ${data.room.name}`;
            });

            socket.on('userList', (data) => {
                console.log('ðŸ‘¥ [AUTHENTIC XAT] User list received:', data.users.length, 'users');
                displayUsers(data.users);
            });

            socket.on('userJoined', (data) => {
                console.log('ðŸ‘‹ [AUTHENTIC XAT] User joined:', data.nickname);
                addSystemMessage(`${data.nickname} joined the chat`);
                updateUserCount();
            });

            socket.on('userLeft', (data) => {
                console.log('ðŸ‘‹ [AUTHENTIC XAT] User left:', data.nickname);
                addSystemMessage(`${data.nickname} left the chat`);
                updateUserCount();
            });

            socket.on('message', (data) => {
                console.log('ðŸ’¬ [AUTHENTIC XAT] Message received:', data);
                addMessage(data.user.nickname, data.message, data.timestamp);
            });

            socket.on('disconnect', () => {
                console.log('ðŸ”Œ [AUTHENTIC XAT] Disconnected from server');
                addSystemMessage('Disconnected from server');
            });

            socket.on('error', (data) => {
                console.error('âŒ [AUTHENTIC XAT] Error:', data);
                addSystemMessage(`Error: ${data.message}`);
            });
        });

        function authenticateAsGuest() {
            const guestName = `Guest${Math.floor(Math.random() * 1000)}`;
            console.log('ðŸ‘¤ [AUTHENTIC XAT] Authenticating as guest:', guestName);
            socket.emit('authenticate', {
                guest: true,
                nickname: guestName
            });
        }

        function joinMainChat() {
            console.log('ðŸšª [AUTHENTIC XAT] Joining main chat (authentic xat behavior)');
            if (socket && socket.connected) {
                socket.emit('joinRoom', { roomName: 'Main Chat' });
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (message && socket) {
                socket.emit('message', { message: message });
                input.value = '';

                // Add own message to chat (authentic xat behavior)
                if (currentUser) {
                    addMessage(currentUser.nickname, message, Date.now());
                }
            }
        }

        function insertSmiley(smiley) {
            const input = document.getElementById('messageInput');
            input.value += smiley;
            input.focus();
        }

        function addMessage(username, message, timestamp) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.style.cssText = 'color:#ffffff; font-family:Arial; font-size:12px; margin-bottom:3px; line-height:14px;';

            const time = timestamp ? new Date(timestamp).toLocaleTimeString() : '';
            messageDiv.innerHTML = `<span style="color:#fed327;">${username}:</span> ${message} <span style="color:#666666; font-size:10px;">${time}</span>`;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.style.cssText = 'color:#fed327; font-family:Arial; font-size:11px; margin-bottom:3px; font-style:italic;';

            messageDiv.innerHTML = `*** ${message} ***`;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function displayUsers(userList) {
            const usersContainer = document.getElementById('users');
            usersContainer.innerHTML = '';

            userList.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.style.cssText = 'color:#ffffff; font-family:Arial; font-size:11px; margin-bottom:2px; padding:2px; cursor:pointer;';
                userDiv.textContent = user.nickname || user.username || 'Unknown';

                // Add rank indicator (authentic xat style)
                if (user.rank === 9) {
                    userDiv.style.color = '#fed327'; // Main Owner - gold
                } else if (user.rank === 4) {
                    userDiv.style.color = '#e74c3c'; // Owner - red
                } else if (user.rank === 3) {
                    userDiv.style.color = '#3498db'; // Moderator - blue
                } else if (user.rank === 2) {
                    userDiv.style.color = '#27ae60'; // Member - green
                } else {
                    userDiv.style.color = '#ffffff'; // Guest - white
                }

                userDiv.onclick = () => showUserProfile(user);
                usersContainer.appendChild(userDiv);
            });

            updateUserCount();
        }

        function updateUserCount() {
            const usersContainer = document.getElementById('users');
            const count = usersContainer.children.length;
            document.getElementById('userCount').textContent = `${count} users`;
        }

        function showUserProfile(user) {
            // Simple profile display (authentic xat style)
            alert(`${user.nickname || user.username}\nRank: ${getRankName(user.rank)}\nXats: ${user.xats || 0}\nDays: ${user.days || 0}`);
        }

        function getRankName(rank) {
            const ranks = {
                9: 'Main Owner',
                4: 'Owner',
                3: 'Moderator',
                2: 'Member',
                1: 'Guest'
            };
            return ranks[rank] || 'Guest';
        }

        function updateUI() {
            if (currentUser) {
                // Update header with user info
                document.querySelector('.hoverxats').textContent = currentUser.xats || 0;
                document.querySelector('.hoverdays').textContent = currentUser.days || 0;
            }
        }

        // Handle Enter key in message input
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        console.log('âœ… [AUTHENTIC XAT] Authentic xat.com interface loaded');
    </script>
