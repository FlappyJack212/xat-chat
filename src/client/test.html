<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Split Files</title>
    <link rel="stylesheet" href="css/chat-interface.css">
</head>
<body>
    <h1>Testing Split Files</h1>
    <p>If you can see this styled properly, the CSS is working!</p>
    
    <!-- Navigation -->
    <div id="navigation-container"></div>
    
    <div class="main-container">
        <div class="left-sidebar">
            <div class="sidebar-icon active">🏠</div>
        </div>
        
        <div class="chat-area">
            <div class="messages-container">
                <div class="message system">Test message!</div>
            </div>
            
            <div class="input-area">
                <input type="text" class="message-input" placeholder="Test input">
                <button class="send-button">SEND</button>
            </div>
        </div>
        
        <div class="right-sidebar">
            <div class="sidebar-tabs">
                <button class="sidebar-tab active">Test</button>
            </div>
        </div>
    </div>
    
    <script src="js/chat-interface.js"></script>
    
    <script>
        // Load navigation
        fetch('/components/navigation.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navigation-container').innerHTML = html;
            })
            .catch(error => console.error('Error loading navigation:', error));
    </script>
</body>
</html>
