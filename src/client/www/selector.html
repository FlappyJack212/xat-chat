<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Selector</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .selector-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ddd;
        }
        .selector-item:hover {
            background: #e9e9e9;
        }
        .selector-category {
            font-weight: bold;
            color: #666;
            margin-top: 15px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="selector-category">Smilies</div>
    <div class="selector-item">😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇</div>
    <div class="selector-item">🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚</div>
    <div class="selector-item">😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🤩</div>
    
    <div class="selector-category">Actions</div>
    <div class="selector-item">👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉</div>
    <div class="selector-item">👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤝 👏</div>
    
    <div class="selector-category">Objects</div>
    <div class="selector-item">❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔</div>
    <div class="selector-item">💯 💢 💥 💫 💦 💨 🕳️ 💣 💤</div>
</body>
</html>
