<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Settings</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .setting-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .setting-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .setting-control {
            margin-top: 5px;
        }
        input[type="checkbox"] {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="setting-item">
        <div class="setting-label">Notifications</div>
        <div class="setting-control">
            <input type="checkbox" id="notifications" checked>
            <label for="notifications">Enable notifications</label>
        </div>
    </div>
    <div class="setting-item">
        <div class="setting-label">Sounds</div>
        <div class="setting-control">
            <input type="checkbox" id="sounds" checked>
            <label for="sounds">Enable sounds</label>
        </div>
    </div>
    <div class="setting-item">
        <div class="setting-label">Theme</div>
        <div class="setting-control">
            <select>
                <option>Light</option>
                <option>Dark</option>
                <option>Auto</option>
            </select>
        </div>
    </div>
    <div class="setting-item">
        <div class="setting-label">Language</div>
        <div class="setting-control">
            <select>
                <option>English</option>
                <option>Spanish</option>
                <option>French</option>
            </select>
        </div>
    </div>
</body>
</html>
