<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Actions</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .action-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ddd;
        }
        .action-item:hover {
            background: #e9e9e9;
        }
    </style>
</head>
<body>
    <div class="action-item">React</div>
    <div class="action-item">Quote</div>
    <div class="action-item">Translate</div>
    <div class="action-item">Edit</div>
    <div class="action-item">Delete</div>
    <div class="action-item">Copy</div>
    <div class="action-item">Copy Link</div>
    <div class="action-item">Copy Smiley</div>
</body>
</html>
