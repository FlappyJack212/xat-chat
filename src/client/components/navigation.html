<script>
// Navigation functionality
document.addEventListener('DOMContentLoaded', function() {
    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');
    const userInfo = document.getElementById('userInfo');
    const authButtons = document.getElementById('authButtons');
    const userName = document.getElementById('userName');
    const userXats = document.getElementById('userXats');
    const logoutBtn = document.getElementById('logoutBtn');

    // Toggle mobile menu
    if (navToggle) {
        navToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });
    }

    // Check authentication status
    function checkAuth() {
        const token = localStorage.getItem('authToken');
        const userProfile = localStorage.getItem('userProfile');
        
        if (token && userProfile) {
            try {
                const user = JSON.parse(userProfile);
                userName.textContent = user.nickname || user.username || 'User';
                userXats.textContent = `${user.xats || 0} xats`;
                userInfo.style.display = 'flex';
                authButtons.style.display = 'none';
            } catch (e) {
                console.error('Error parsing user profile:', e);
                localStorage.removeItem('authToken');
                localStorage.removeItem('userProfile');
            }
        } else {
            userInfo.style.display = 'none';
            authButtons.style.display = 'flex';
        }
    }

    // Logout functionality
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    }
                });
                
                localStorage.removeItem('authToken');
                localStorage.removeItem('userProfile');
                window.location.href = '/index.html';
            } catch (error) {
                console.error('Logout error:', error);
                localStorage.removeItem('authToken');
                localStorage.removeItem('userProfile');
                window.location.href = '/index.html';
            }
        });
    }

    // Set active link based on current page
    function setActiveLink() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');
        
        navLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href') && currentPath.includes(link.getAttribute('href').replace('../', ''))) {
                link.classList.add('active');
            }
        });
    }

    // Initialize
    checkAuth();
    setActiveLink();

    // Listen for auth changes
    window.addEventListener('storage', (e) => {
        if (e.key === 'authToken' || e.key === 'userProfile') {
            checkAuth();
        }
    });
});
</script>
