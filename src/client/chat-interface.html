<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iXat Chat</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/chat-interface.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="modules/auth-system.js"></script>
</head>
<body>
    <!-- Navigation -->
    <div id="navigation-container"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Sidebar -->
        <div class="left-sidebar">
            <div class="sidebar-icon active" title="Home">🏠</div>
            <div class="sidebar-icon" title="Play">▶️</div>
            <div class="sidebar-icon" title="People">👥</div>
            <div class="sidebar-icon" title="Profile">👤</div>
            <div class="sidebar-icon" title="Games">🃏</div>
            <div class="sidebar-icon" title="Settings">⚙️</div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <!-- Chat Tabs -->
            <div class="chat-tabs">
                <div class="chat-tab active" data-chat="main" id="mainChatTab">
                    <span class="tab-name">Main Chat</span>
                    <span class="unread-indicator" id="mainUnreadIndicator" style="display: none;">●</span>
                </div>
                <div class="chat-tab" data-chat="private" id="privateChatTab" style="display: none;">
                    <span class="tab-name">Private Chat</span>
                    <span class="unread-indicator" id="privateUnreadIndicator" style="display: none;">●</span>
                    <button class="close-tab" onclick="closePrivateChat()">×</button>
                </div>
            </div>
            
            <!-- Main Chat Container -->
            <div class="chat-container active" id="mainChatContainer">
                <div class="messages-container" id="messagesContainer">
                    <div class="message system">Welcome to iXat Chat!</div>
                    <div class="message system">Chat is now active. Start typing to send messages!</div>
                </div>
                <div class="input-area">
                    <div class="typing-indicator" id="typingIndicator"></div>
                    <div class="input-row">
                        <input type="text" class="message-input" id="messageInput" placeholder="Type your message...">
                        <button class="send-button" id="sendButton">SEND</button>
                    </div>
                </div>
            </div>
            
            <!-- Private Chat Container -->
            <div class="chat-container" id="privateChatContainer" style="display: none;">
                <div class="private-chat-header">
                    <span id="privateChatTitle">Private Chat</span>
                    <div class="private-chat-actions">
                        <button onclick="clearPrivateChat()" title="Clear Chat">🗑️</button>
                        <button onclick="closePrivateChat()" title="Close">×</button>
                    </div>
                </div>
                <div class="messages-container" id="privateMessagesContainer">
                    <!-- Private messages will be added here -->
                </div>
                <div class="input-area">
                    <div class="typing-indicator" id="privateTypingIndicator"></div>
                    <div class="input-row">
                        <input type="text" class="message-input" id="privateMessageInput" placeholder="Type private message...">
                        <button class="send-button" id="privateSendButton">SEND</button>
                    </div>
                </div>
            </div>
        </div>
                
        <!-- Right Sidebar -->
        <div class="right-sidebar">
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" id="visitorsTab">Visitors</button>
                <button class="sidebar-tab" id="friendsTab">Friends</button>
                </div>
            <div class="visitors-list" id="visitorsList">
                <div class="visitor-item">
                    <div class="visitor-pawn">♟️</div>
                    <div class="visitor-avatar">👤</div>
                    <div class="visitor-info">
                        <div class="visitor-name">Guest <span class="visitor-id">GUEST</span></div>
                    </div>
                </div>
            </div>
            
            <div class="visitors-list" id="friendsList" style="display: none;">
                <div style="text-align: center; color: #95a5a6; padding: 20px;">
                    No friends yet. Add some friends by clicking on users!
                </div>
            </div>
            <div class="right-icons">
                <button class="right-icon" title="Groups">👥</button>
                <button class="right-icon" title="Help">❓</button>
                <button class="right-icon" title="Home">🏠</button>
                </div>
            <div class="action-buttons">
                <button class="action-button" id="getChatBtn">Get a Chat Box</button>
                <button class="action-button" id="signInBtn">Sign In</button>
                </div>
            </div>
        </div>
        
    <!-- Quickbar -->
    <div id="quickbar-container"></div>

    <!-- Scripts -->
    <script>
        // Initialize auth system
        const authSystem = new AuthSystem();
        
        fetch('quickbar.html').then(r => r.text()).then(html => {
            document.getElementById('quickbar-container').innerHTML = html;
        setTimeout(() => {
                const quickbarToggle = document.getElementById('quickbarToggle');
                const quickbar = document.getElementById('quickbar');
                if (quickbarToggle && quickbar) {
                    quickbarToggle.addEventListener('click', () => quickbar.classList.toggle('open'));
                }
                
                // Add event listeners for quickbar action buttons
                const actionButtons = {
                    'openProfileBtn': openProfileEditor,
                    'toggleVisitorsBtn': toggleVisitorsList,
                    'toggleNightModeBtn': toggleNightMode,
                    'openTranslatorBtn': openTranslator,
                    'showGroupPowersBtn': showGroupPowers,
                    'startVoteBtn': startVote,
                    'openSettingsBtn': openSettings
                };
                
                Object.entries(actionButtons).forEach(([id, handler]) => {
                    const btn = document.getElementById(id);
                    if (btn) btn.addEventListener('click', handler);
                });
        }, 100);
        }).catch(console.error);
        
        // Load navigation
        fetch('/components/navigation.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navigation-container').innerHTML = html;
            })
            .catch(error => console.error('Error loading navigation:', error));
    </script>
    <script src="js/chat-interface.js"></script>
</body>
</html>
